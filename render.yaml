# Render blueprint for the NestJS API. Import it from the Render dashboard with
# "New > Blueprint" and point it at this repo.
#
# The web dashboard is NOT here - it deploys to Vercel from apps/web.
# See docs/deployment.md for the full walkthrough.

services:
  - type: web
    name: mail-sender-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # Build the whole workspace: @mailer/api imports @mailer/shared from its
    # dist, so shared has to be compiled before nest build runs.
    #
    # --prod=false is load-bearing: NODE_ENV=production (set below) otherwise
    # makes pnpm skip devDependencies, and the build needs @nestjs/cli, prisma
    # and typescript, all of which live there.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @mailer/shared build &&
      pnpm --filter @mailer/api prisma:generate:prod &&
      pnpm --filter @mailer/api build
    # Migrations run on every boot. `migrate deploy` only applies pending
    # migrations and never prompts, so a redeploy with nothing new is a no-op.
    startCommand: >-
      pnpm --filter @mailer/api prisma:deploy:prod &&
      node apps/api/dist/main.js
    # /health also opens an SMTP connection to verify the transport; /health/live
    # is the cheap check, which is what a per-minute probe should hit.
    healthCheckPath: /api/health/live

    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api

      # Neon connection string. Use the POOLED host (…-pooler.…) so the free
      # plan's connection cap is not exhausted, and keep sslmode=require.
      - key: DATABASE_URL
        sync: false

      # Comma-separated Vercel origins allowed to call this API, no trailing
      # slash - e.g. https://mail-sender.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # ---------- Resend over SMTP ----------
      - key: MAIL_TRANSPORT
        value: smtp
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      # Resend's SMTP username is the literal string "resend"; the password is
      # the API key.
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASSWORD
        sync: false

      # Must be on a domain verified in Resend, or every send is rejected.
      - key: MAIL_FROM_NAME
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false

      - key: SEND_BATCH_SIZE
        value: "50"
